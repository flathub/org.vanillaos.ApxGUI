id: org.vanillaos.ApxGUI
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: apx-gui

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-run/podman:ro
  - --talk-name=org.freedesktop.Flatpak
cleanup:
  - '*.a'
  - /include

modules:
  - name: apx
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin
    build-commands:
      - go build -o /app/bin/apx -mod=vendor ./cmd
    sources:
      - type: git
        url: https://github.com/Vanilla-OS/apx.git
        tag: v3.1.1
        commit: af06ccaa71413089d8c3189863b75cfe6cc9d8f0
        x-checker-data:
          type: json
          url: https://api.github.com/repos/Vanilla-OS/apx/releases/latest
          tag-query: .tag_name
      - go.mod.yml

  - name: apx-configs
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/apx
      - mv * /app/share/apx
    sources:
      - type: git
        url: https://github.com/Vanilla-OS/vanilla-apx-configs.git
        tag: v1.1.0
        commit: 9c52b9e7436948dc464ac5d5aac02dd3e4944ff1
        x-checker-data:
          type: json
          url: https://api.github.com/repos/Vanilla-OS/vanilla-apx-configs/releases/latest
          tag-query: .tag_name
      - type: file
        path: config.json

  - name: fast_float
    buildsystem: cmake-ninja
    cleanup:
      - /share
    sources:
      - type: git
        url: https://github.com/fastfloat/fast_float.git
        tag: v8.2.7
        commit: e0b53eaf63c6d00e0725788ef1dbb759aa321d79
        x-checker-data:
          type: anitya
          project-id: 214353
          tag-template: v$version

  - name: simdutf
    buildsystem: cmake-ninja
    cleanup:
      - /lib/cmake
    sources:
      - type: git
        url: https://github.com/simdutf/simdutf.git
        tag: v9.0.0
        commit: ca7acbcea967b5dcbab490066e99e3a6e6925539
        x-checker-data:
          type: anitya
          project-id: 378662
          tag-template: v$version

  - name: vte
    buildsystem: meson
    cleanup:
      - /share
    config-opts:
      - -Dapp=false
      - -Dglade=false
      - -Dgtk3=false
      - -Dvapi=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/vte/0.84/vte-0.84.0.tar.xz
        sha256: 0414e31583836aeb7878da25f67c515f7e8879917ecc37c92e26b83e8d8fc3e3
        x-checker-data:
          type: gnome
          name: vte

  - python3-podman.json

  - python3-PyYAML.json

  - name: apx-gui
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/Vanilla-OS/apx-gui.git
        tag: v1.1.0
        commit: 8754f62d47266b9ffc10487743c267abecc1ea75
        x-checker-data:
          type: json
          url: https://api.github.com/repos/Vanilla-OS/apx-gui/releases/latest
          tag-query: .tag_name
